<!DOCTYPE html>
<html lang="en" data-theme="signal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Ad Platform{% endblock %} — Ad Platform</title>
  <meta name="description" content="{% block description %}Self-hosted ad platform management dashboard{% endblock %}" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Compiled CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') if url_for is defined else '/static/css/main.css' }}" />
</head>
<body class="bg-base-100 text-base-content font-sans antialiased min-h-screen">

  <!-- Flash notifications container -->
  {% if get_flashed_messages is defined %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div id="flash-container" class="fixed top-4 right-4 z-[999] space-y-2 w-80">
          {% for category, message in messages %}
            <div role="alert" class="alert {{ 'alert-success' if category == 'success' else 'alert-error' }} shadow-lg text-sm transition-opacity duration-300">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                {% if category == 'success' %}
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                {% else %}
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                {% endif %}
              </svg>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
        <script>
          setTimeout(() => {
            const el = document.getElementById('flash-container');
            if (el) {
              el.style.opacity = '0';
              setTimeout(() => el.remove(), 300);
            }
          }, 4000);
        </script>
      {% endif %}
    {% endwith %}
  {% endif %}

  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
