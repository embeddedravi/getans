services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adplatform}
      MYSQL_USER: ${MYSQL_USER:-adplatform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"   # loopback only; drop if you don't need host access
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Overrides backend/.env so both containers share one password.
      # URL-encode MYSQL_PASSWORD if it contains special characters.
      ADPLATFORM_DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-adplatform}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-adplatform}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: