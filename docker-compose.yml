services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adplatform
      POSTGRES_PASSWORD: adplatform
      POSTGRES_DB: adplatform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  pg_data:
