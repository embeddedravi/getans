services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-adplatform}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; drop entirely if you don't need host access
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Overrides any value in backend/.env so both containers share one password.
      ADPLATFORM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adplatform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-adplatform}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pg_data: